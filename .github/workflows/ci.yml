name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  logica:
    name: Lint e testes de lógica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  bdd:
    name: Cenários BDD (Robot Framework)
    needs: logica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/robot/requirements.txt
      - run: npm ci
      - run: pip install -r tests/robot/requirements.txt
      - run: rfbrowser init --with-deps chromium
      - name: Rodar os cenários
        run: python -m robot --outputdir results/robot tests/robot/features
      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-robot
          path: results/robot
          retention-days: 14

  e2e-js:
    name: Testes funcionais em JavaScript (até portar tudo para Robot, issue 26)
    needs: logica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
